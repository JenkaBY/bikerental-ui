name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      disable_service_worker:
        description: 'EMERGENCY: unregister the operator PWA service worker and wipe its caches on every client'
        type: boolean
        default: false

env:
  PROJECT_NAME: bikerental-ui

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint + angular-eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gateway tests
        run: npx ng test gateway --configuration=ci

      - name: Run admin tests
        run: npx ng test admin --configuration=ci

      - name: Run operator tests
        run: npx ng test operator --configuration=ci

      - name: Run shared tests
        run: npx ng test shared --configuration=ci

      - name: Merge coverage reports
        run: |
          mkdir -p coverage/merged
          cat coverage/gateway/lcov.info coverage/admin/lcov.info coverage/operator/lcov.info coverage/shared/lcov.info > coverage/merged/lcov.info

      - name: Publish gateway coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: gateway
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/gateway/coverage-summary.json
          json-final-path: coverage/gateway/coverage-final.json

      - name: Publish admin coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: admin
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/admin/coverage-summary.json
          json-final-path: coverage/admin/coverage-final.json

      - name: Publish operator coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: operator
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/operator/coverage-summary.json
          json-final-path: coverage/operator/coverage-final.json

      - name: Publish shared coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: shared
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/shared/coverage-summary.json
          json-final-path: coverage/shared/coverage-final.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Builds and releases only the pi target — preview and production, both on the Raspberry Pi, one
  # image for both (see notify-server below). GitHub Pages (the dev environment) is a separate,
  # manually-run workflow: deploy-pages.yml. That split is deliberate, not just file organization —
  # Pages publishes whatever branch a person chooses, on no fixed schedule, while this workflow is
  # what runs on every push/PR and is what actually ships to real users, so the two must not share a
  # trigger or a job graph.
  build:
    name: Build (pi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ quality, test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stamps the deployed commit into two places, so "which version is this
      # client actually running?" is answerable without guesswork:
      #  - environment.appVersion is baked into the bundle, so it reports the
      #    version of the code that is really executing — even when the service
      #    worker is serving a stale build, which is exactly when it matters.
      #  - ngsw.json appData describes the manifest, so the deployed version can
      #    be read straight off the live site:
      #      curl -s https://<host>/operator/en/ngsw.json | jq .appData
      - name: Stamp build version
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s|BIKE_VERSION_PLACEHOLDER|${VERSION}|g" projects/shared/src/environments/environment.prod.ts
          sed -i "s|BIKE_VERSION_PLACEHOLDER|${VERSION}|g" projects/operator/ngsw-config.json
          sed -i "s|BIKE_BUILD_TIME_PLACEHOLDER|${BUILD_TIME}|g" projects/operator/ngsw-config.json
          echo "Stamped version ${VERSION} (${BUILD_TIME})"

      # Base href of `/` for all three: the gateway is the index page at the domain root, and the
      # container's router (not a base href prefix) is what routes /admin/ and /operator/ to their apps.
      - name: Build gateway
        run: npx ng build gateway --configuration production --base-href /

      - name: Build admin
        run: npx ng build admin --configuration production --base-href /admin/

      - name: Build operator
        run: npx ng build operator --configuration production --base-href /operator/

      # Each application keeps its own layer in the image (see docker/Dockerfile), so an unchanged
      # application re-uses its layer instead of being pushed again over a residential uplink.
      - name: Assemble staging directory
        run: |
          mkdir -p staging/gateway staging/admin staging/operator
          cp -r dist/gateway/browser/. staging/gateway/
          cp -r dist/admin/browser/. staging/admin/
          cp -r dist/operator/browser/. staging/operator/

      # Turns the assembled tree into the container's routing config. It reads which
      # locales exist rather than being told, so adding a language changes nothing
      # here, and it refuses to emit a config whose fallback locale is missing.
      - name: Generate UI container routing config
        run: npm run gen:ui-config

      # Emergency kill switch — the fleet-wide recovery path of last resort.
      # Replaces the operator's ngsw-worker.js with Angular's safety-worker,
      # which unregisters the service worker and deletes every `ngsw:` cache on
      # each client that loads the app. Use it when a bad deploy pins clients to
      # a broken or stale build and no ordinary fix can reach them: run this
      # workflow manually on master with `disable_service_worker: true`, confirm
      # clients recovered, then re-run it normally to restore the PWA.
      #
      # Browsers bypass the HTTP cache for the service worker script itself, so
      # clients pick this up on their next navigation. ngsw-worker.js is not
      # listed in its own ngsw.json hashTable, so swapping it does not trip the
      # integrity check below.
      - name: Deploy service worker kill switch
        if: inputs.disable_service_worker
        run: |
          shopt -s nullglob
          manifests=(staging/operator/*/ngsw.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No operator ngsw.json under staging/ — nothing to disable."
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "${manifest}")"
            cp node_modules/@angular/service-worker/safety-worker.js "${dir}/ngsw-worker.js"
            echo "Kill switch armed for ${dir}"
          done

      # Guards the service worker's integrity, and must stay the LAST step that
      # touches staging/ before the upload. Every file listed in an ngsw.json
      # hashTable is pinned by SHA1 at build time; if any of those files is
      # mutated after the build (e.g. a post-build HTML rewrite), the worker
      # fails to install the new version, degrades to EXISTING_CLIENTS_ONLY, and
      # pins clients to the stale cached version forever. This fails the build
      # instead, so such a regression can never reach production again. It also
      # asserts one manifest per app/locale declared in angular.json, so a
      # locale silently losing its service worker fails the build too.
      - name: Verify ngsw.json hash integrity
        run: npm run verify:ngsw

      - name: Upload container payload
        uses: actions/upload-artifact@v7
        with:
          name: ui-container-payload
          path: |
            staging
            docker/Caddyfile.generated
          retention-days: 7

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [ quality, test, build ]
    if: always()
    steps:
      - name: All CI checks passed
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed."

  # The image carries the already-built tree and nothing else, so building for a foreign architecture
  # from an amd64 runner needs no emulation: a COPY has no architecture. The package is public, which
  # is what lets the production host pull it without holding a credential for this repository.
  # Runs on an actual merge to master (releasing to preview, see notify-server below), plus the one
  # exception that must reach the Pi container regardless: the service-worker kill switch, which is
  # itself only ever a deliberate, explicit workflow_dispatch. An ordinary manual run without that flag
  # publishes nothing here.
  image:
    name: Publish UI image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ ci ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.disable_service_worker))
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download container payload
        uses: actions/download-artifact@v8
        with:
          name: ui-container-payload

      # Same shape as the API's image tags (sha-<7hex>), because the production host's deploy script
      # validates that shape and refuses anything else — including `latest`.
      - name: Derive image tag
        id: tag
        run: echo "version=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Both of these are v4: their 4.0.0 moved to Node 24, which needs Actions Runner 2.327.1 or
      # later. These two jobs run on GitHub-hosted runners, which are well past that — but note the
      # constraint before copying either line into a job that targets the production host's runner.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/bike-rental-ui"
          # BOTH ARCHITECTURES. The production host is arm64; amd64 is what a developer runs the image
          # on locally, and what the API image already publishes. Neither costs build time here: this
          # Dockerfile only copies an already-built tree, so there is nothing to emulate under QEMU.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --file docker/Dockerfile \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push .
          echo "Pushed ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
  # Releases to PREVIEW on an ordinary merge. Production is a deliberate act, not a side effect of a
  # merge: a person promotes an already-published sha-<7> tag to production by hand, by running
  # "Deploy UI to production" in JenkaBY/bike-rental with that version — no rebuild, since one image
  # serves both Pi environments (see the `pi` target above). The one exception is the service-worker
  # kill switch: that emergency exists to recover PRODUCTION clients, so it targets production instead
  # of preview even though it also runs through this job.
  notify-server:
    name: Release to preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ image ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.disable_service_worker))
    permissions: {}
    steps:
      - name: Dispatch deployment event
        env:
          TAG: ${{ needs.image.outputs.version }}
          TARGET_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.disable_service_worker) && 'production' || 'preview' }}
          DISPATCH_TOKEN: ${{ secrets.PI_DEPLOY_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::error::PI_DEPLOY_TOKEN is not set — ${TARGET_ENV} was not told about ${TAG}."
            echo "Deploy it by hand: run 'Deploy UI to production' in JenkaBY/bike-rental with version ${TAG} and environment ${TARGET_ENV}."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/JenkaBY/bike-rental/dispatches \
            -d "$(jq -nc --arg v "${TAG}" --arg e "${TARGET_ENV}" '{event_type:"ui-image-published",client_payload:{version:$v,environment:$e}}')"
          echo "Dispatched ui-image-published for ${TAG} (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
