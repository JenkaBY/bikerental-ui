name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy the dev build of this ref to GitHub Pages (the only way Pages is ever deployed — a merge to master does not do it)'
        type: boolean
        default: false
      disable_service_worker:
        description: 'EMERGENCY: unregister the operator PWA service worker and wipe its caches on every client'
        type: boolean
        default: false

env:
  PROJECT_NAME: bikerental-ui

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint + angular-eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gateway tests
        run: npx ng test gateway --configuration=ci

      - name: Run admin tests
        run: npx ng test admin --configuration=ci

      - name: Run operator tests
        run: npx ng test operator --configuration=ci

      - name: Run shared tests
        run: npx ng test shared --configuration=ci

      - name: Merge coverage reports
        run: |
          mkdir -p coverage/merged
          cat coverage/gateway/lcov.info coverage/admin/lcov.info coverage/operator/lcov.info coverage/shared/lcov.info > coverage/merged/lcov.info

      - name: Publish gateway coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: gateway
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/gateway/coverage-summary.json
          json-final-path: coverage/gateway/coverage-final.json

      - name: Publish admin coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: admin
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/admin/coverage-summary.json
          json-final-path: coverage/admin/coverage-final.json

      - name: Publish operator coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: operator
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/operator/coverage-summary.json
          json-final-path: coverage/operator/coverage-final.json

      - name: Publish shared coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: shared
          threshold-icons: "{0: '🔴', 80: '🔵', 90: '🟢'}"
          json-summary-path: coverage/shared/coverage-summary.json
          json-final-path: coverage/shared/coverage-final.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # THREE ENVIRONMENTS (dev, preview, production), TWO BUILD TARGETS, ONE BUILD DEFINITION.
  #
  #   pages — GitHub Pages. Serves the dev environment, the Render web service. Served from a
  #           repository-name prefix, so every base href carries it, and the gateway ships as the
  #           application chooser. Pages serves static files only, so the locale redirects and the
  #           SPA deep-link recovery are files this job writes by hand.
  #   pi    — the Raspberry Pi host. ONE image serves both preview and production: the router puts
  #           the browser clients and the API on the same origin in both, so environment.prod.ts reads
  #           that origin at runtime instead of a build-time host, and nothing in this build tells the
  #           two apart — that only happens at deploy time (see notify-server below, and bike-rental's
  #           own manual promotion trigger). Served at the domain root, so the base hrefs carry no
  #           prefix. The redirect files Pages needs are not written here — scripts/gen-ui-config.mjs
  #           turns those same rules into routing config instead.
  #
  # The two differ in base href and in which of the Pages workarounds run — everything per-target is
  # declared in the matrix below. `pages` is also the only target built against an absolute API host:
  # it is genuinely cross-origin (GitHub Pages → Render), so that host is injected at build time. Build
  # FLAGS are deliberately not among the differences: the dev configuration carries nothing but the
  # environment-file swap and composes onto production, so the demo cannot drift from the production
  # build — a difference in build flags between the demo and production would be found in production.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ quality, test ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pages
            configuration: production,dev
            env_file: projects/shared/src/environments/environment.dev.ts
            api_url: ${{ vars.BIKE_RENTAL_TEST_API }}
          - target: pi
            configuration: production
            env_file: projects/shared/src/environments/environment.prod.ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pages only: it is the one target that is genuinely cross-origin from its API, so the host has
      # to be known at build time. pi resolves its API from window.location.origin at runtime instead
      # (see environment.prod.ts) — there is no placeholder left in that file for this step to fill.
      - name: Inject Bike Rental API host into pages
        if: matrix.target == 'pages'
        env:
          API_URL: ${{ matrix.api_url }}
        run: |
          if [ -z "${API_URL}" ]; then
            echo "::error::No API base URL for target ${{ matrix.target }} — set the repository variable BIKE_RENTAL_TEST_API."
            exit 1
          fi
          sed -i "s|BIKE_API_PLACEHOLDER|${API_URL}|g" "${{ matrix.env_file }}"

      # Stamps the deployed commit into two places, so "which version is this
      # client actually running?" is answerable without guesswork:
      #  - environment.appVersion is baked into the bundle, so it reports the
      #    version of the code that is really executing — even when the service
      #    worker is serving a stale build, which is exactly when it matters.
      #  - ngsw.json appData describes the manifest, so the deployed version can
      #    be read straight off the live site:
      #      curl -s https://<host>/operator/en/ngsw.json | jq .appData
      - name: Stamp build version
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s|BIKE_VERSION_PLACEHOLDER|${VERSION}|g" "${{ matrix.env_file }}"
          sed -i "s|BIKE_VERSION_PLACEHOLDER|${VERSION}|g" projects/operator/ngsw-config.json
          sed -i "s|BIKE_BUILD_TIME_PLACEHOLDER|${BUILD_TIME}|g" projects/operator/ngsw-config.json
          echo "Stamped version ${VERSION} (${BUILD_TIME})"

      # The other per-target value every build step reads. It is derived rather than declared in the
      # matrix because it carries the repository name, which only the github context knows.
      - name: Resolve base href prefix
        id: href
        run: |
          if [ "${{ matrix.target }}" = "pages" ]; then
            echo "prefix=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=" >> "$GITHUB_OUTPUT"
          fi

      # Built for both targets, and with the same base href of `<prefix>/` for both: the gateway is the
      # index page, so its locales ARE the top-level URLs. Where the two targets differ is only where
      # that tree is put — see the assembly step.
      - name: Build gateway
        run: npx ng build gateway --configuration ${{ matrix.configuration }} --base-href ${{ steps.href.outputs.prefix }}/

      - name: Build admin
        run: npx ng build admin --configuration ${{ matrix.configuration }} --base-href ${{ steps.href.outputs.prefix }}/admin/

      - name: Build operator
        run: npx ng build operator --configuration ${{ matrix.configuration }} --base-href ${{ steps.href.outputs.prefix }}/operator/

      # THE ONE PLACE THE TWO TARGETS LAY OUT THE SAME BUILD DIFFERENTLY, and the reason is the gateway.
      # Its locales are addressed as top-level URLs (/en/, /ru/) in both, but Pages serves files straight
      # off the tree, so there they must physically sit at the top; the container has a router, so there
      # they get a directory of their own and the routing points at it. That directory is what keeps one
      # image layer per application — an unchanged application then re-uses its layer instead of being
      # pushed again over a residential uplink.
      - name: Assemble staging directory
        run: |
          mkdir -p staging/admin staging/operator
          if [ "${{ matrix.target }}" = "pages" ]; then
            cp -r dist/gateway/browser/. staging/
          else
            mkdir -p staging/gateway
            cp -r dist/gateway/browser/. staging/gateway/
          fi
          cp -r dist/admin/browser/. staging/admin/
          cp -r dist/operator/browser/. staging/operator/

      - name: Create root redirect to /en/
        if: matrix.target == 'pages'
        run: |
          BASE="/${{ github.event.repository.name }}"
          cat > staging/index.html << 'HTMLEOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Bike Rental</title>
              <meta http-equiv="refresh" content="0; url=BASE_PLACEHOLDER/en/" />
              <script>window.location.replace('BASE_PLACEHOLDER/en/');</script>
            </head>
            <body></body>
          </html>
          HTMLEOF
          sed -i "s|BASE_PLACEHOLDER|${BASE}|g" staging/index.html

      # Each app is built into per-locale subdirectories (admin/en, admin/ru, ...).
      # A bare /admin/ or /operator/ URL has no index.html, so without this it would
      # fall through to the site 404.html and bounce to the gateway. This adds an
      # entry index.html per app that forwards to the default (en) locale — which is
      # also the URL the OIDC redirect_uri / app links should target.
      #
      # The pi target needs none of this: its router answers a bare /admin with a
      # 302, and answers an unbuilt locale with one too, which a static file cannot.
      - name: Create per-app locale redirects
        if: matrix.target == 'pages'
        run: |
          BASE="/${{ github.event.repository.name }}"
          for app in admin operator; do
            cat > "staging/${app}/index.html" << 'HTMLEOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Bike Rental</title>
              <meta http-equiv="refresh" content="0; url=BASE_PLACEHOLDER/APP_PLACEHOLDER/en/" />
              <script>window.location.replace('BASE_PLACEHOLDER/APP_PLACEHOLDER/en/');</script>
            </head>
            <body></body>
          </html>
          HTMLEOF
            sed -i "s|BASE_PLACEHOLDER|${BASE}|g; s|APP_PLACEHOLDER|${app}|g" "staging/${app}/index.html"
          done

      # GitHub Pages only ever serves the 404.html at the SITE ROOT — nested
      # 404.html files (admin/en/404.html, etc.) are never looked up and are
      # dead weight. This single root 404.html inspects the requested path,
      # works out which app/locale directory actually has a real index.html,
      # and bounces there with the original path+query preserved in a
      # `redirect` param (classic GH Pages SPA trick). The matching
      # restore-script lives in each app's checked-in entry point —
      # projects/{gateway,admin,operator}/src/index.html — and puts the real
      # URL back via history.replaceState before Angular bootstraps, so deep
      # links survive the 404 hop instead of losing their query string.
      #
      # That script MUST stay in the source index.html and must never be
      # injected here: index.html is SHA1-pinned in the operator's ngsw.json
      # hashTable at build time, so rewriting it post-build breaks the service
      # worker (see the integrity check below). It is harmless on the pi target,
      # where nothing ever sets the `redirect` parameter.
      - name: Add smart 404.html for SPA routing
        if: matrix.target == 'pages'
        run: |
          BASE="/${{ github.event.repository.name }}"
          cat > staging/404.html << 'HTMLEOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Bike Rental</title>
              <script>
                (function () {
                  var base = 'BASE_PLACEHOLDER/';
                  var path = window.location.pathname;
                  var rel = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
                  var segments = rel.split('/').filter(Boolean);
                  var apps = ['admin', 'operator'];
                  var locales = ['en', 'ru'];
                  var appDir;
                  if (apps.indexOf(segments[0]) !== -1) {
                    var locale = locales.indexOf(segments[1]) !== -1 ? segments[1] : 'en';
                    appDir = segments[0] + '/' + locale;
                  } else if (locales.indexOf(segments[0]) !== -1) {
                    appDir = segments[0];
                  } else {
                    appDir = 'en';
                  }
                  var original = path + window.location.search + window.location.hash;
                  window.location.replace(base + appDir + '/?redirect=' + encodeURIComponent(original));
                })();
              </script>
            </head>
            <body></body>
          </html>
          HTMLEOF
          sed -i "s|BASE_PLACEHOLDER|${BASE}|g" staging/404.html

      # Turns the assembled tree into the container's routing config. It reads which
      # locales exist rather than being told, so adding a language changes nothing
      # here, and it refuses to emit a config whose fallback locale is missing.
      - name: Generate UI container routing config
        if: matrix.target == 'pi'
        run: npm run gen:ui-config

      # Emergency kill switch — the fleet-wide recovery path of last resort.
      # Replaces the operator's ngsw-worker.js with Angular's safety-worker,
      # which unregisters the service worker and deletes every `ngsw:` cache on
      # each client that loads the app. Use it when a bad deploy pins clients to
      # a broken or stale build and no ordinary fix can reach them: run this
      # workflow manually on master with `disable_service_worker: true`, confirm
      # clients recovered, then re-run it normally to restore the PWA.
      #
      # Browsers bypass the HTTP cache for the service worker script itself, so
      # clients pick this up on their next navigation. ngsw-worker.js is not
      # listed in its own ngsw.json hashTable, so swapping it does not trip the
      # integrity check below.
      - name: Deploy service worker kill switch
        if: inputs.disable_service_worker
        run: |
          shopt -s nullglob
          manifests=(staging/operator/*/ngsw.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No operator ngsw.json under staging/ — nothing to disable."
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "${manifest}")"
            cp node_modules/@angular/service-worker/safety-worker.js "${dir}/ngsw-worker.js"
            echo "Kill switch armed for ${dir}"
          done

      # Guards the service worker's integrity, and must stay the LAST step that
      # touches staging/ before the upload. Every file listed in an ngsw.json
      # hashTable is pinned by SHA1 at build time; if any of those files is
      # mutated after the build (e.g. a post-build HTML rewrite), the worker
      # fails to install the new version, degrades to EXISTING_CLIENTS_ONLY, and
      # pins clients to the stale cached version forever. This fails the build
      # instead, so such a regression can never reach production again. It also
      # asserts one manifest per app/locale declared in angular.json, so a
      # locale silently losing its service worker fails the build too.
      - name: Verify ngsw.json hash integrity
        run: npm run verify:ngsw

      - name: Upload Pages artifact
        if: matrix.target == 'pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: staging

      - name: Upload container payload
        if: matrix.target == 'pi'
        uses: actions/upload-artifact@v7
        with:
          name: ui-container-payload
          path: |
            staging
            docker/Caddyfile.generated
          retention-days: 7

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [ quality, test, build ]
    if: always()
    steps:
      - name: All CI checks passed
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed."

  # Manual and cross-branch on purpose: Pages is the public demo, and publishing whatever the current
  # branch happens to contain must be a decision someone makes, not a side effect of merging or of an
  # unrelated workflow_dispatch (e.g. the service-worker kill switch below) — hence its own input
  # rather than "any manual run deploys Pages".
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ ci ]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The image carries the already-built tree and nothing else, so building for a foreign architecture
  # from an amd64 runner needs no emulation: a COPY has no architecture. The package is public, which
  # is what lets the production host pull it without holding a credential for this repository.
  # Runs on an actual merge to master (releasing to preview, see notify-server below), plus the one
  # exception that must reach the Pi container regardless: the service-worker kill switch, which is
  # itself only ever a deliberate, explicit workflow_dispatch. An ordinary manual run (e.g. one that
  # only sets deploy_pages) publishes nothing here.
  image:
    name: Publish UI image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ ci ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.disable_service_worker))
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download container payload
        uses: actions/download-artifact@v8
        with:
          name: ui-container-payload

      # Same shape as the API's image tags (sha-<7hex>), because the production host's deploy script
      # validates that shape and refuses anything else — including `latest`.
      - name: Derive image tag
        id: tag
        run: echo "version=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Both of these are v4: their 4.0.0 moved to Node 24, which needs Actions Runner 2.327.1 or
      # later. These two jobs run on GitHub-hosted runners, which are well past that — but note the
      # constraint before copying either line into a job that targets the production host's runner.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/bike-rental-ui"
          # BOTH ARCHITECTURES. The production host is arm64; amd64 is what a developer runs the image
          # on locally, and what the API image already publishes. Neither costs build time here: this
          # Dockerfile only copies an already-built tree, so there is nothing to emulate under QEMU.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --file docker/Dockerfile \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push .
          echo "Pushed ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
  # Releases to PREVIEW on an ordinary merge. Production is a deliberate act, not a side effect of a
  # merge: a person promotes an already-published sha-<7> tag to production by hand, by running
  # "Deploy UI to production" in JenkaBY/bike-rental with that version — no rebuild, since one image
  # serves both Pi environments (see the `pi` target above). The one exception is the service-worker
  # kill switch: that emergency exists to recover PRODUCTION clients, so it targets production instead
  # of preview even though it also runs through this job.
  notify-server:
    name: Release to preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ image ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.disable_service_worker))
    permissions: {}
    steps:
      - name: Dispatch deployment event
        env:
          TAG: ${{ needs.image.outputs.version }}
          TARGET_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.disable_service_worker) && 'production' || 'preview' }}
          DISPATCH_TOKEN: ${{ secrets.PI_DEPLOY_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::error::PI_DEPLOY_TOKEN is not set — ${TARGET_ENV} was not told about ${TAG}."
            echo "Deploy it by hand: run 'Deploy UI to production' in JenkaBY/bike-rental with version ${TAG} and environment ${TARGET_ENV}."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/JenkaBY/bike-rental/dispatches \
            -d "$(jq -nc --arg v "${TAG}" --arg e "${TARGET_ENV}" '{event_type:"ui-image-published",client_payload:{version:$v,environment:$e}}')"
          echo "Dispatched ui-image-published for ${TAG} (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
